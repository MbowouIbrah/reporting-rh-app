# À inclure dans le server { } du nginx d'Academy (seule modification d'Academy).
# Le conteneur nginx d'Academy doit être rattaché au réseau Docker "edge".

location /reporting-rh/api/ {
    proxy_pass http://reporting-rh-api-1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /reporting-rh/ {
    proxy_pass http://reporting-rh-web-1:80;
    proxy_set_header Host $host;
}
