# Sert la page et passe /api à l'API (service « api » du docker-compose).
map $http_x_forwarded_proto $proto_public {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Connexion, changement de mot de passe, mot de passe oublié, réinitialisation : 10 essais par minute et par adresse, rafale de 10.
# Une clé vide ne compte pas : les autres routes ne sont pas limitées.
map $uri $cle_connexion {
  default "";
  /api/v1/auth/login $binary_remote_addr;
  /api/v1/auth/mot-de-passe-oublie $binary_remote_addr;
  /api/v1/auth/reinitialiser $binary_remote_addr;
  /api/v1/auth/changer-mot-de-passe $binary_remote_addr;
}
limit_req_zone $cle_connexion zone=connexion:1m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Derrière le proxy HTTPS : la limite s'applique à l'adresse du client, pas à celle du proxy.
  # Un seul proxy : la dernière adresse est celle qu'il a ajoutée ; un poste ne peut pas la fausser.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  # Les imports sont plafonnés à 20 Mo par l'API.
  client_max_body_size 21m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    limit_req zone=connexion burst=10 nodelay;
    limit_req_status 429;
    # Résolu à chaque requête : nginx démarre même si l'API redémarre.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_public;
    proxy_read_timeout 120s;
  }

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
